[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazy-cli"
version = "0.1.0"
description = "Privacy-aware natural-language command assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["lazy_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
